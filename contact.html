<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Audrey Care</title>
<meta name="description" content="Get in touch with Audrey Care. Questions about an order, our products or bulk supply — we’re happy to help.">
<meta name="theme-color" content="#143d2c">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="contact">
<script src="js/config.js"></script><script src="js/content.js"></script><script src="js/data.js"></script><script src="js/art.js"></script><script src="js/layout.js"></script>

<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">›</span><span>Contact</span></nav>
      <h1 class="display">We’d love to hear from you</h1>
      <p class="lead">Questions about an order, a product, or supplying your business? Send us a message.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap two">
      <div class="reveal" style="display:grid;gap:22px" id="reach">
        <h2 class="h2">Get in <em>touch</em></h2>
        <ul class="values" id="reachList"></ul>
        <p class="muted">Looking for an order you’ve already placed? <a style="text-decoration:underline" href="order.html">Track it here</a>.</p>
      </div>
      <div class="reveal" style="--d:1" id="formWrap">
        <form id="contactForm" class="co-step" novalidate style="margin:0">
          <div class="form-grid">
            <div class="field" data-field="name"><label for="name">Your name</label><input class="input" id="name" name="name" autocomplete="name"><div class="err" role="alert"></div></div>
            <div class="field" data-field="phone"><label for="phone">Mobile number <small>(optional)</small></label><input class="input" id="phone" name="phone" type="tel" autocomplete="tel"><div class="err" role="alert"></div></div>
            <div class="field full" data-field="email"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email"><div class="err" role="alert"></div></div>
            <div class="field full" data-field="message"><label for="message">Message</label><textarea class="textarea" id="message" name="message"></textarea><div class="err" role="alert"></div></div>
          </div>
          <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="notice notice--err form-error" role="alert" hidden style="margin-top:16px"></div>
          <button class="btn btn--block" type="submit" style="margin-top:24px;padding-block:20px">Send message</button>
        </form>
      </div>
    </div>
  </section>
</main>

<script src="js/app.js"></script>
<script src="js/pages/forms.js"></script>
</body>
</html>
