<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — Audrey Care</title>
<meta name="description" content="Shop Audrey Care shampoos, conditioners, shower gels, body lotions, hand wash, bubble bath and air fresheners.">
<meta name="theme-color" content="#143d2c">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="shop">
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/art.js"></script><script src="js/layout.js"></script>

<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span id="crumbNow">Shop</span></nav>
      <h1 class="display" id="shopTitle">All products</h1>
      <p class="lead" id="shopLead">Gentle everyday care for hair, body, hands and home.</p>
    </div>
  </section>

  <section class="wrap">
    <div class="shop-bar">
      <div style="display:grid;gap:14px">
        <div class="chips" id="groupChips" role="group" aria-label="Category"></div>
        <div class="chips" id="kindChips" role="group" aria-label="Product type" hidden></div>
        <div class="chips" id="scentChips" role="group" aria-label="Fragrance"></div>
      </div>
      <div class="sort"><span class="result-count" id="count" role="status"></span>
        <label for="sort" class="sr-only">Sort by</label>
        <select class="select" id="sort">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
    </div>
    <div class="grid" id="grid" aria-live="polite" style="margin-bottom:clamp(64px,8vw,120px)"></div>
  </section>
</main>

<script src="js/app.js"></script>
<script src="js/pages/shop.js"></script>
</body>
</html>
